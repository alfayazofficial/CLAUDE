<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><defs><pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.6" fill="#DCE3FF" opacity="0.13"/></pattern></defs><rect x="0" y="0" width="1080" height="1080" fill="#F7F4EC"/><g transform="translate(80 60) scale(0.4666666666666667)"><rect x="0" y="0" width="120" height="120" fill="#0F1B33" rx="28"/><path d="M33 22 H70 L89 41 V98 H33 Z" fill="#FFFFFF"/><path d="M70 22 V41 H89 Z" fill="#DCE3FF"/><rect x="42" y="52" width="28" height="5" fill="#E6E9F0" rx="2.5"/><rect x="42" y="62" width="38" height="5" fill="#E6E9F0" rx="2.5"/><rect x="40" y="74" width="42" height="11" fill="#F6A82C" rx="5.5"/><rect x="42" y="77" width="30" height="5" fill="#0F1B33" rx="2.5" opacity="0.9"/></g><text x="151.68" y="99.19999999999999" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="31.360000000000003" font-weight="700" fill="#0F1B33" letter-spacing="-0.31360000000000005">Paper<tspan fill="#3A4FE0">wright</tspan></text><text x="80" y="210" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#0F1B33" text-anchor="start">From draft to</text><text x="80" y="280" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#3A4FE0" text-anchor="start">submit-ready.</text><rect x="116" y="390" width="4" height="470" fill="#E6E9F0" rx="2"/><circle cx="118" cy="408" r="38" fill="#0F1B33"/><text x="118" y="422" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="190" y="404" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#0F1B33" text-anchor="start">Brief</text><text x="190" y="448" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="400" fill="#5B6477" text-anchor="start">Share your goal, target journal and deadline</text><circle cx="118" cy="568" r="38" fill="#0F1B33"/><text x="118" y="582" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="190" y="564" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#0F1B33" text-anchor="start">Review</text><text x="190" y="608" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="400" fill="#5B6477" text-anchor="start">Line-by-line feedback on argument and method</text><circle cx="118" cy="728" r="38" fill="#0F1B33"/><text x="118" y="742" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="190" y="724" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#0F1B33" text-anchor="start">Revise</text><text x="190" y="768" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="400" fill="#5B6477" text-anchor="start">You stay the author. We coach, edit and format</text><circle cx="118" cy="888" r="38" fill="#F6A82C"/><text x="118" y="902" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#0F1B33" text-anchor="middle">4</text><text x="190" y="884" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#0F1B33" text-anchor="start">Submit</text><text x="190" y="928" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="400" fill="#5B6477" text-anchor="start">Final checklist, cover letter and proof-read</text><rect x="80" y="968" width="920" height="2" fill="#E6E9F0" opacity="1"/><text x="80" y="1024" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="600" fill="#5B6477" text-anchor="start">@paperwright</text><text x="1000" y="1024" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="28" font-weight="600" fill="#3A4FE0" text-anchor="end">Research, written right.</text></svg>