<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><defs><pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.6" fill="#DCE3FF" opacity="0.13"/></pattern></defs><rect x="0" y="0" width="1080" height="1080" fill="#3A4FE0"/><rect x="0" y="0" width="1080" height="1080" fill="url(#dots)"/><text x="80" y="130" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#F6A82C" text-anchor="start" letter-spacing="5">WRITING TIP #01</text><text x="70" y="400" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="260" font-weight="700" fill="#F6A82C" text-anchor="start" opacity="0.9">“</text><text x="80" y="540" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#FFFFFF" text-anchor="start">State your research</text><text x="80" y="628" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#FFFFFF" text-anchor="start">question in one</text><text x="80" y="716" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#FFFFFF" text-anchor="start">sentence. If you</text><text x="80" y="804" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#FFFFFF" text-anchor="start">can’t, reviewers</text><text x="80" y="892" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#F6A82C" text-anchor="start">can’t either.</text><rect x="80" y="968" width="920" height="2" fill="#DCE3FF" opacity="0.25"/><text x="80" y="1024" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="600" fill="#DCE3FF" text-anchor="start">@paperwright</text><text x="1000" y="1024" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="28" font-weight="600" fill="#F6A82C" text-anchor="end">Research, written right.</text></svg>