<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paperwright Brand Board</title><link rel="stylesheet" href="tokens/colors.css">
<style>body{margin:0;background:var(--pw-parchment);color:var(--pw-ink);font-family:Inter, 'Helvetica Neue', Arial, sans-serif}
main{max-width:1200px;margin:0 auto;padding:32px 20px 80px}h1,h2{font-family:Fraunces, Georgia, 'Times New Roman', serif}h2{margin:48px 0 16px;border-bottom:3px solid var(--pw-amber);display:inline-block;padding-bottom:4px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}img{width:100%;height:auto;border-radius:12px;border:1px solid var(--pw-mist);background:#fff}
.wide{display:block;margin-bottom:16px}small{color:var(--pw-slate)}</style></head><body><main>
<h1>Paperwright - Brand Board</h1><small>Research, written right. Open each file in /logo, /social, /tokens.</small>
<h2>Logo</h2><div class="grid"><img class="" src="logo/paperwright-horizontal-light.svg" alt="paperwright-horizontal-light.svg"><img class="" src="logo/paperwright-horizontal-dark.svg" alt="paperwright-horizontal-dark.svg"><img class="" src="logo/paperwright-stacked-light.svg" alt="paperwright-stacked-light.svg"><img class="" src="logo/paperwright-mark.svg" alt="paperwright-mark.svg"><img class="" src="logo/paperwright-mono-black.svg" alt="paperwright-mono-black.svg"><img class="" src="logo/paperwright-mono-white.svg" alt="paperwright-mono-white.svg"></div>
<h2>Palette</h2><img class="wide" src="logo/paperwright-palette.svg" alt="paperwright-palette.svg">
<h2>Banners</h2><img class="wide" src="social/banners/linkedin-banner-1584x396.svg" alt="linkedin-banner-1584x396.svg"><img class="wide" src="social/banners/x-header-1500x500.svg" alt="x-header-1500x500.svg"><img class="wide" src="social/banners/facebook-cover-1640x624.svg" alt="facebook-cover-1640x624.svg"><img class="wide" src="social/banners/youtube-banner-2560x1440.svg" alt="youtube-banner-2560x1440.svg">
<h2>Posts</h2><div class="grid"><img class="" src="social/posts/instagram-01-launch-1080x1080.svg" alt="instagram-01-launch-1080x1080.svg"><img class="" src="social/posts/instagram-02-services-1080x1080.svg" alt="instagram-02-services-1080x1080.svg"><img class="" src="social/posts/instagram-03-writing-tip-1080x1080.svg" alt="instagram-03-writing-tip-1080x1080.svg"><img class="" src="social/posts/instagram-04-process-1080x1080.svg" alt="instagram-04-process-1080x1080.svg"><img class="" src="social/posts/instagram-05-checklist-1080x1080.svg" alt="instagram-05-checklist-1080x1080.svg"><img class="" src="social/posts/instagram-06-cta-1080x1080.svg" alt="instagram-06-cta-1080x1080.svg"><img class="" src="social/posts/linkedin-post-1200x627.svg" alt="linkedin-post-1200x627.svg"><img class="" src="social/posts/instagram-story-1080x1920.svg" alt="instagram-story-1080x1920.svg"></div>
</main></body></html>
