  <circle cx="400" cy="520" r="20" fill="#FF3D6E"/><path d="M390 530H410L418 580H382Z" fill="#FF3D6E"/>
  <text x="400" y="700" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-weight="700" font-size="30" fill="#00E5FF" letter-spacing="6">CYBER · ANIMATED</text>
</svg>
