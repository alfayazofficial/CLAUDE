<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1236"/><stop offset=".6" stop-color="#050816"/><stop offset="1" stop-color="#0A1A2E"/></linearGradient>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00E5FF"/><stop offset="1" stop-color="#39FF88"/></linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="2560" height="1440" fill="url(#bg)"/>
  <!-- grid -->
  <g stroke="#17265A" stroke-width="2" opacity=".6">
    <path d="M0 240H2560M0 480H2560M0 720H2560M0 960H2560M0 1200H2560"/>
    <path d="M320 0V1440M640 0V1440M960 0V1440M1280 0V1440M1600 0V1440M1920 0V1440M2240 0V1440"/>
  </g>
  <!-- network / circuit art on the sides (outside the YouTube safe area) -->
  <g stroke="#00E5FF" stroke-width="3" fill="none" opacity=".55" filter="url(#glow)">
    <path d="M60 300H260L340 380H560L620 320"/><path d="M60 1100H300L380 1020H520"/><path d="M180 700H420L480 760H640"/>
    <path d="M2500 300H2300L2220 380H2000L1940 320"/><path d="M2500 1100H2260L2180 1020H2040"/><path d="M2380 700H2140L2080 760H1920"/>
  </g>
  <g fill="#39FF88" filter="url(#glow)">
    <circle cx="620" cy="320" r="12"/><circle cx="520" cy="1020" r="12"/><circle cx="640" cy="760" r="12"/>
    <circle cx="1940" cy="320" r="12"/><circle cx="2040" cy="1020" r="12"/><circle cx="1920" cy="760" r="12"/>
  </g>
  <g fill="#FF3D6E"><circle cx="340" cy="380" r="10"/><circle cx="2220" cy="380" r="10"/></g>
  <!-- binary rain texture -->
  <g font-family="'DejaVu Sans Mono', monospace" font-size="30" fill="#39FF88" opacity=".14">
    <text x="120" y="120">01001101 01010011 10110010</text><text x="1700" y="140">11010010 00110101 01101001</text>
    <text x="200" y="1340">10010110 01110100 00101101</text><text x="1800" y="1320">01101010 11001001 10100110</text>
  </g>
  <!-- SAFE AREA (center 1546x423 for all devices) -->
  <g transform="translate(1280 720)">
    <path d="M-110 -150 L0 -190 L110 -150 V-30 C110 40 60 85 0 110 C-60 85 -110 40 -110 -30 Z" fill="#0A1230" stroke="url(#ln)" stroke-width="8" filter="url(#glow)" transform="translate(-520 -10) scale(.95)"/>
    <text x="-520" y="-20" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="78" fill="#E8F0FF" letter-spacing="-3">MS</text>
    <text x="-380" y="-30" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="150" fill="#E8F0FF" letter-spacing="-4">MD SULEMAN</text>
    <rect x="-380" y="0" width="880" height="8" rx="4" fill="url(#ln)" filter="url(#glow)"/>
    <text x="-380" y="80" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="58" fill="#00E5FF">Cybersecurity, explained in motion.</text>
    <text x="-380" y="150" font-family="'DejaVu Sans Mono', monospace" font-weight="700" font-size="34" fill="#39FF88" letter-spacing="3">&gt; new animated video every day_</text>
  </g>
</svg>
